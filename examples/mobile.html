<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile — Homeflix</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#e2e8f0] grid place-items-center min-h-screen p-6 font-[Outfit]">
<div class="w-[390px] bg-black rounded-[48px] p-3 shadow-2xl">
  <div class="bg-white rounded-[40px] overflow-hidden relative">
    <div class="absolute top-2 left-1/2 -translate-x-1/2 w-24 h-6 bg-black rounded-full z-10"></div>
    <div class="h-[760px] flex flex-col">
      <div class="px-5 pt-10 flex justify-between items-center"><span class="font-bold">Homeflix</span><img src="https://i.pravatar.cc/100?img=15" class="w-8 h-8 rounded-full"></div>
      <div class="px-3 mt-3"><div class="relative rounded-[24px] overflow-hidden h-[380px]"><img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600&q=80" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div><div class="absolute bottom-0 p-4 text-white"><h3 class="font-bold text-xl">Dune: Part Two</h3><div class="flex gap-2 mt-3"><button class="flex-1 bg-white text-black py-3 rounded-full font-semibold">▶ Play</button><button class="w-11 h-11 rounded-full bg-white/20 grid place-items-center">+</button></div></div></div></div>
      <div class="px-5 mt-4"><div class="font-semibold text-sm mb-2">Continue Watching</div><div class="flex gap-3 overflow-x-auto"><div class="min-w-[140px]"><div class="h-20 rounded-xl overflow-hidden"><img src="https://images.unsplash.com/photo-1574267432553-4b4628081c31?w=300&q=80" class="w-full h-full object-cover"></div><div class="text-xs font-medium">Interstellar</div></div><div class="min-w-[140px]"><div class="h-20 rounded-xl overflow-hidden"><img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300&q=80" class="w-full h-full object-cover"></div><div class="text-xs font-medium">The Batman</div></div></div></div>
      <div class="mt-auto border-t flex justify-around py-3 text-xs"><span class="font-bold">⌂ Home</span><span class="text-slate-400">◎ Search</span><span class="text-slate-400">♡ List</span><span class="text-slate-400">◐ Profile</span></div>
    </div>
  </div>
</div>
</body>
</html>
