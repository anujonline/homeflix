<!DOCTYPE html>
<html lang="en">
<head>

<title>Bento — Homeflix</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f8fafc] font-sans text-slate-900">
<div class="max-w-[1200px] mx-auto p-6 md:p-8">
  <div class="flex justify-between items-center mb-6"><h1 class="font-bold text-2xl" style="font-family:'Space Grotesk'">Good evening, Alex</h1><img src="https://i.pravatar.cc/100?img=33" class="w-10 h-10 rounded-full"></div>

  </div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
    <div class="bg-white rounded-2xl overflow-hidden border"><img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963d?w=400&q=80" class="w-full aspect-[3/4] object-cover"><div class="p-3 text-sm font-medium">Inside Out 2</div></div>
    <div class="bg-white rounded-2xl overflow-hidden border"><img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80" class="w-full aspect-[3/4] object-cover"><div class="p-3 text-sm font-medium">Civil War</div></div>
    <div class="bg-white rounded-2xl overflow-hidden border"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400&q=80" class="w-full aspect-[3/4] object-cover"><div class="p-3 text-sm font-medium">The Fall Guy</div></div>
    <div class="bg-slate-900 text-white rounded-2xl p-6 flex flex-col justify-center"><div class="font-bold">200+ titles</div><button class="mt-4 bg-white text-black px-4 py-2 rounded-full text-sm font-semibold">Browse</button></div>
  </div>
