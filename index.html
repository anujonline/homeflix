<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homeflix</title>
    <!-- Dynamic theme-color for PWA system UI bars -->
    <meta name="theme-color" content="#020617">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png">
    <script>
      // Initialize theme before page render to prevent flash
      (function() {
        const theme = localStorage.getItem('homeflix_theme') || 'dark';
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          if (themeColorMeta) themeColorMeta.setAttribute('content', '#020617');
        } else {
          document.documentElement.classList.remove('dark');
          if (themeColorMeta) themeColorMeta.setAttribute('content', '#f8fafc');
        }
      })();

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#bf9708',
                600: '#bf9708',
                700: '#a68207',
                500: '#d4a90a',
                400: '#e1b710',
              },
            },
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            borderRadius: {
              '4xl': '28px',
            },
            keyframes: {
              shine: {
                '0%': { transform: 'translateX(-160%) skewX(-15deg)' },
                '100%': { transform: 'translateX(460%) skewX(-15deg)' },
              },
            },
            animation: {
              shine: 'shine 1.1s ease-in-out',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        scrollbar-gutter: stable;
      }
      body {
        font-family: 'Outfit', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
        -webkit-font-smoothing: antialiased;
      }
      .dark body {
        background-color: #020617; /* Slate 950 */
        color: #f8fafc; /* Slate 50 */
      }
      body:not(.dark) {
        background-color: #f8fafc; /* Slate 50 */
        color: #020617; /* Slate 950 */
      }
      
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
  <script async defer src="https://admin.pcitrix.com/tracker.js" data-website-id="cm5heda1a33cc41p22waicwd8"></script>
</head>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
